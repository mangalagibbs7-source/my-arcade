<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ff;
    --panel: #ffffff;
    --ink: #1b1d3a;
    --muted: #6a6d8f;
    --line: #d8d4f0;
    --accent: #e8436a;
    --accent-ink: #ffffff;
    --board: #1b1d3a;
    --snake-head: #3ddbd9;
    --snake-body: #22a9ad;
    --food: #ffc857;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14172b; --panel: #1e2245; --ink: #f1efff; --muted: #9a9dc4;
      --line: #323765; --accent: #ff6b8a; --accent-ink: #14172b;
      --board: #0e1022;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14172b; --panel: #1e2245; --ink: #f1efff; --muted: #9a9dc4;
    --line: #323765; --accent: #ff6b8a; --accent-ink: #14172b;
    --board: #0e1022;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--body); line-height: 1.5; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 40px; }
  h1 {
    font-family: var(--display); font-weight: 400; margin: 0 0 6px;
    font-size: clamp(34px, 9vw, 52px); line-height: 1.05; letter-spacing: 0.5px;
  }
  .sub { color: var(--muted); margin: 0 0 26px; }

  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card {
    appearance: none; text-align: left; cursor: pointer; font: inherit; color: inherit;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
    padding: 18px; display: block; width: 100%;
  }
  .card:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .card:active { transform: scale(0.98); }
  .card .emoji { font-size: 44px; line-height: 1; }
  .card .name { font-family: var(--display); font-size: 22px; margin-top: 12px; }
  .card .desc { color: var(--muted); font-size: 15px; margin-top: 2px; }

  #snake[hidden], #home[hidden] { display: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; }
  .btn {
    appearance: none; border: 0; cursor: pointer; font: inherit; font-weight: 700;
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 20px; border-radius: 12px; font-size: 16px;
  }
  .btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
  .scores { display: flex; gap: 18px; font-weight: 700; }
  .scores span span { font-family: var(--display); font-weight: 400; font-size: 20px; }
  .board-wrap { display: flex; justify-content: center; }
  canvas {
    width: min(100%, 440px); aspect-ratio: 1 / 1; height: auto;
    background: var(--board); border-radius: 16px; border: 3px solid var(--line);
    touch-action: none; display: block;
  }
  .dpad {
    display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(2, 72px);
    gap: 10px; justify-content: center; margin: 20px 0 8px;
  }
  .dpad button {
    appearance: none; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 18px; font-size: 28px; cursor: pointer; touch-action: manipulation;
  }
  .dpad button:active { background: var(--accent); color: var(--accent-ink); }
  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }
  .hint { text-align: center; color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <section id="home">
    <h1>Pocket Arcade</h1>
    <p class="sub">Quick games that run right in your browser.</p>
    <div class="grid">
      <button class="card" id="open-snake">
        <div class="emoji">🐍</div>
        <div class="name">Snake</div>
        <div class="desc">Eat, grow, don't crash.</div>
      </button>
    </div>
  </section>

  <section id="snake" hidden>
    <div class="topbar">
      <button class="btn ghost" id="back">Back</button>
      <div class="scores">
        <span>Score <span id="score">0</span></span>
        <span>Best <span id="best">0</span></span>
      </div>
    </div>
    <div class="board-wrap"><canvas id="game" width="360" height="360" aria-label="Snake game board"></canvas></div>
    <div class="dpad" aria-label="Controls">
      <button class="up" data-dx="0" data-dy="-1" aria-label="Up">&#9650;</button>
      <button class="left" data-dx="-1" data-dy="0" aria-label="Left">&#9664;</button>
      <button class="down" data-dx="0" data-dy="1" aria-label="Down">&#9660;</button>
      <button class="right" data-dx="1" data-dy="0" aria-label="Right">&#9654;</button>
    </div>
    <p class="hint">Tap the arrows, swipe the board, or use the arrow keys.</p>
    <p style="text-align:center"><button class="btn" id="restart">Restart</button></p>
  </section>

</div>

<script>
(function () {
  var home = document.getElementById('home');
  var snakeView = document.getElementById('snake');
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');

  var CELLS = 18, SIZE = canvas.width / CELLS;
  var snake, dir, nextDir, food, score = 0, best = 0, timer = null, over = false;

  try { best = parseInt(localStorage.getItem('arcade-snake-best'), 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function start() {
    snake = [{x: 9, y: 9}, {x: 8, y: 9}, {x: 7, y: 9}];
    dir = nextDir = {x: 1, y: 0};
    score = 0; over = false;
    scoreEl.textContent = 0;
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, 125);
    draw();
  }

  function stop() { clearInterval(timer); timer = null; }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * CELLS), y: Math.floor(Math.random() * CELLS)};
    } while (snake.some(function (s) { return s.x === food.x && s.y === food.y; }));
  }

  function tick() {
    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    var wall = head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS;
    var self = snake.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (wall || self) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++; scoreEl.textContent = score; placeFood();
    } else { snake.pop(); }
    draw();
  }

  function draw() {
    ctx.fillStyle = css('--board');
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = css('--food');
    ctx.beginPath();
    ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? css('--snake-head') : css('--snake-body');
      ctx.fillRect(s.x * SIZE + 1, s.y * SIZE + 1, SIZE - 2, SIZE - 2);
    });
  }

  function gameOver() {
    over = true; stop();
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('arcade-snake-best', String(best)); } catch (e) {}
    }
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = '30px Bungee, Arial Black, sans-serif';
    ctx.fillText('Game over', canvas.width / 2, canvas.height / 2 - 6);
    ctx.font = '16px Nunito, sans-serif';
    ctx.fillText('Score ' + score + ' - tap Restart', canvas.width / 2, canvas.height / 2 + 26);
  }

  function turn(x, y) {
    if (x === -dir.x && y === -dir.y) return;
    nextDir = {x: x, y: y};
  }

  document.addEventListener('keydown', function (e) {
    if (snakeView.hidden) return;
    var k = {ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
             w: [0,-1], s: [0,1], a: [-1,0], d: [1,0]}[e.key];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
  });

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (b) {
    b.addEventListener('click', function () {
      turn(parseInt(b.dataset.dx, 10), parseInt(b.dataset.dy, 10));
    });
  });

  var sx = 0, sy = 0;
  canvas.addEventListener('touchstart', function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, {passive: true});
  canvas.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });

  document.getElementById('open-snake').addEventListener('click', function () {
    home.hidden = true; snakeView.hidden = false; start();
  });
  document.getElementById('back').addEventListener('click', function () {
    stop(); snakeView.hidden = true; home.hidden = false;
  });
  document.getElementById('restart').addEventListener('click', start);
})();
</script>
</body>
</html>
